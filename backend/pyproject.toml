[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "ai-test-generator-backend"
version = "0.1.0"
description = "FastAPI backend for AI Test Generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.9.2",
    "pydantic-settings>=2.10.1,<3.0.0",
    "openai>=2.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-openai>=1.0.0",
    "langsmith>=0.3.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.26",
    "pymupdf==1.25.5",
    "slowapi==0.1.9",
    "motor==3.6.1",
    "bcrypt==4.2.1",
    "faiss-cpu==1.9.0.post1",
    "langchain-community>=0.4.0,<0.5.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-env==1.1.5",
    "ruff==0.15.12",
    "poethepoet==0.45.0",
    "scipy==1.15.2",
]

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload --port 8080 --log-config uvicorn_log_config.json"
lint = "ruff check ."
lint-fix = "ruff check --fix ."
test = "pytest"

# Organize imports (Ruff isort) then format — `ruff format` alone does not sort imports.
[tool.poe.tasks.organize-imports]
cmd = "ruff check --select I --fix ."

[tool.poe.tasks.format]
sequence = ["organize-imports", { cmd = "ruff format ." }]

[tool.pytest.ini_options]
env = ["OPENAI_API_KEY=pytest-dummy-key", "MONGODB_URI="]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["app"]
