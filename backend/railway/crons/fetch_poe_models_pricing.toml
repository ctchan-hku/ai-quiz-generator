# Cron job "fetch Poe models pricing": Root = backend, Config Path = this file, Volume at /data.
# More crons: new service pointing at railway/crons/<another_action>.toml.
[build]
builder = "NIXPACKS"

[deploy]
cronSchedule = "0 8 * * *"
startCommand = "env POE_MODELS_PRICING_PATH=/data/poe_models_pricing.json python cron/fetch_poe_models_pricing.py"
restartPolicyType = "ON_FAILURE"
requiredMountPath = "/data"
