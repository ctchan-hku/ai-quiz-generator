name: ai-test-generator-dev

version: "3.7"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    environment:
      APP_ENV: dev
      MONGODB_DB_NAME: getting_interested
      OPENAI_BASE_URL: https://api.poe.com/v1
      ALLOWED_ORIGINS: "*"
      AVAILABLE_MODELS: '[{"id":"gemini-3-flash","label":"Gemini 3 Flash"},{"id":"gemini-3.1-pro","label":"Gemini 3.1 Pro"},{"id":"claude-sonnet-4.6","label":"Claude Sonnet 4.6"},{"id":"gpt-5.1-instant","label":"GPT-5.1 Instant"},{"id":"grok-4.20-multi-agent","label":"Grok 4.20 (multi-agent)"},{"id":"deepseek-v4-pro-e","label":"DeepSeek V4 Pro-E"}]'
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      DATA_DIR: /app/data/runtime
      STATIC_DATA_DIR: /app/data/static
    volumes:
      - ./app:/app/app
      - ./data/runtime:/app/data/runtime
    networks:
      - gi20-shared-network
    command:
      [
        "uvicorn",
        "app.main:app",
        "--reload",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--log-config",
        "uvicorn_log_config.json",
      ]

networks:
  gi20-shared-network:
    external: true
    name: gi20-shared-network
