name: ai-test-generator-dev

version: "3.7"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    environment:
      APP_ENV: dev
      OPENAI_BASE_URL: https://api.poe.com/v1
    volumes:
      - ./app:/app/app
      - ./data/runtime:/app/data/runtime
    networks:
      - gi20-shared-network
    command:
      [
        "uvicorn",
        "app.main:app",
        "--reload",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--log-config",
        "uvicorn_log_config.json",
      ]

networks:
  gi20-shared-network:
    external: true
    name: gi20-shared-network
