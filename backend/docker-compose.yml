name: ai-test-generator

version: "3.7"

services:
  api:
    container_name: ai-test-generator-api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ai_test_generator_runtime:/app/data/runtime
      - gi20_secrets_container:/run/secrets:ro
    networks:
      - gi20backendnetwork-prod
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

networks:
  gi20backendnetwork-prod:
    name: gi20network
    external: true
    driver: bridge

volumes:
  ai_test_generator_runtime:
    name: ai_test_generator_runtime
  gi20_secrets_container:
    external: true
    name: gi-20-backend_gi20_secrets_container
