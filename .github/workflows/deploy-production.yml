name: Rebuild Production Server

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, production]
    defaults:
      run:
        working-directory: ${{ vars.SERVER_DIRECTORY }}
    steps:
      - name: Execute Database Backup Script
        run: |
          ${{ vars.BACKUP_SCRIPT_PATH }}

      - name: Pull latest main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
          git reset --hard FETCH_HEAD

      - name: Rebuild
        run: |
          cd backend
          docker compose build

      - name: Restart
        run: |
          cd backend
          docker compose up -d --remove-orphans --force-recreate --wait

      - name: Verify database readiness
        run: |
          docker run --rm --network gi20network curlimages/curl:8.5.0 \
            -fsS http://ai-test-generator-api:8080/db/health
